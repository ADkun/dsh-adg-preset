# The `Adg` agent preset: 调度智能体（dispatcher）+ 一个通用子代理（多智能体模式）。
#
# 本文件是这份 preset 的**唯一真相源**：改 preset 就是改它。生成物由
# `node tools/gen-preset-bundle.mjs` 产出（在 `.gitignore` 里），**不许手改**。
# 设计口径与不变量见 `preset/design.md`；改动入口与校验见 `preset/AGENTS.md`；
# 增删委派能力见技能 `adg-delegation`（`${DSH_HOME:-~/.dsh}/skills/adg-delegation/SKILL.md`）；
# 未观测项（含量法）见 `preset/design.md` 的「For Agents」一节。
#
# This file is an AGENT-PLANE composition: the roster mounts it ONCE under a standing scope, and
# every session naming it joins by scope parentage, so the tools and prompt sections registered
# here cover each joined agent. The host composition (`base.cordis.yml` + `web.cordis.yml`) keeps
# what a preset must not own: the registries, the sandbox and approval stack, persistence, and the
# model route.
#
# 编辑红线（违反即返工；每条都有实测或源码依据，理由见 `preset/design.md` 的非功能红线）：
#   1. 不写通用 `subagent` / `subagent_fork` 行：子代理会继承整套组合，一旦有通用行，
#      子代理就能绕过自己的范围再开一个不受限的子代理。
#   2. 委派行的 `toolFilter` 是**挂载期**写死的：能力面要按任务现配，所以 `agent` 行
#      刻意不写它 —— 过滤由 `delegate` 的 `tools` 在每次委派时落下（toolFilter 是交集、
#      只减不增，动态传的就是最终面）。`tools` 里只能写已注册的工具名 ——
#      未知名会让**那一次委派**抛 `names unknown global tool ...`（不是挂载失败）。
#   3. 承载体积旋钮的三行（`compaction-basic` / `tool-result-pruner` / `tool-web`）**不写 config**：
#      截断工具结果会把工具已经取到的事实切掉，一律用插件出厂默认值。
#   4. 拿到 `pwsh` 的委派必须同时给 `job_list` / `job_output` / `job_kill`。
#   5. 不给委派行写 `maxDepth`（写 0 会让每一次委派失败），也不给任何请求写
#      `maxTokens` / `agentOptions` / `reasoningEffort`。
#   6. `delegate` 的 `tools` 里不写 `workflow` / `ralph`，也不写 `skill`。
#   7. 构建期注入的工具名（billion-context 的 `compress` / `decompress` / `search_context` /
#      `acp_status`，save-token 的 `save_token_expand`）与 `compaction-basic` 的 `config.auto`
#      只能由 `tools/gen-preset-bundle.mjs` 按探测结果注入（清单在 `tools/flavors.mjs`），
#      不许手写进本文件 —— `tools/check-preset.mjs` 会把它们判成 ERROR。
#   8. 调度 persona 的**约束**与**验收标准**两段是踩过的坑换来的：条目不许删，也不许改写成
#      分步流程、固定字段表或字数预算（逐条判据见 `preset/testing-guide.md`）。
#   9. composition 里每个 `@deepseek-ai/*` 包名要对着当前安装核对：沿用旧名会让 registry 判
#      整份 preset `broken`（`… never started`），Adg 模式在新会话里直接不可用。
#      核对判据：`node tools/check-preset.mjs` 退 0，且真实挂载后 `agentPresets.resolve('adg')`
#      的 `.broken` 为空。
#
# 唯一的委派行 = `delegation` 组里的 `agent` 行：不写 persona、不写 toolFilter、不写 maxDepth。
# 子代理的目标 / 边界由调度者在委派里写（persona 只在需要专门视角时才给），能力面由
# `delegate` 的 `tools` 决定，`backgroundMode: continuable` 让它后台接续干活
# （结果以结算通知回到调度者）。
#
# 一个 service 行必须坐在带 `isolate` realm 的组里：否则它发布到 root realm、成为进程级实例，
# 与别的 preset 撞名（`dsh-agent-presets` 在挂载时拒绝）。`true` 表示 entry-local realm。
# （A shared label does NOT pool instances — labels join REALMS, and a second `provide()` under
# the same realm symbol throws; an entry-local realm is what this file needs.）

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` resolves from the agent's own route.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是 Adg 多智能体模式的调度智能体（dispatcher）。

      ## 目标
      把用户的话变成一件做完的事：理解意图、拆成子代理能执行的原子任务、给这次委派定好能力面、汇总交付。
      你自己不碰文件、不改系统设置、不操作网页 —— 只做调度与汇总。唯一例外：中间工件可写进平台临时目录（见「中转材料」）。

      ## 你手上的子代理（只有一个：通用子代理 `agent`，它的能力面由你每次现定）
      `agent` 本身不带固定职责，也没有 persona：它干什么、能用哪些工具，全看你这次委派里写给它的目标与边界。委派用 `delegate`（`description` / `prompt` / `tools` / `persona` / `background`）：`tools` 是它这次能用的全部工具，省略＝它继承到的全部；`persona` 只在需要专门视角时才给。工具名是硬边界：写进 `tools` 的才存在。派发范围因此由你的 `tools` 决定，不是由某个专家的名字决定。

      ## 约束

      【拆解立目标】接到任务先把任务拆成【目标】、【要干什么】、【不要干什么】、【验收标准】四块 —— 它是本次交付的验收依据，也是委派与最后验收时逐条对照的底本。

      【要不要派】一两次工具调用（web_search / web_fetch / read / grep）就能答完的，自己答 —— 为一次抓取派子代理要多付一整个子代理的固定开销。派发前问自己：这个答案会改变我要交付的东西吗？它是验收标准的一部分吗？需要子代理的能力闭环吗？三个都不是就不派，只在交付里挂号「未纳入本次：X（可能影响 Y，未调研）」，不要静默丢掉。

      【派给谁】没有固定专家名册可对照，所以"派给谁"就是"给它哪些工具、要不要给 persona"：能闭环就不拆成底层工具调用，覆盖不到才逐级降级（子代理→技能→工具→生成代码）。照任务选工具面（这些只是例子；拿不准就给最小面，或干脆**省略 `tools`** 让它继承全部 —— 猜错不会失败，未生效的名字会出现在 `tools_note` 里）：只读检索给 read / glob / grep；联网搜索给 web_search / web_fetch；写入改动在其上加 write / edit；要它边做边自证就加 pwsh 与 job_list / job_output / job_kill（后台任务收集工具必须与 pwsh 同时给）；需要对抗性验证就另派一个只给 read / grep / pwsh 的子代理。要看图（截图 / 图片内容）就给它 `read_image`（多模态模型读图靠它；点名给工具面时别漏）—— 它是**条件性注册**的名字，没注册时那一次委派直接失败，拿不到就改用可查询的状态量作判据。要「边开发边自验」就把**写与验的工具一次给齐**，别让同一个子代理下一轮才发现缺工具。**工具面在创建那一刻就钉死、事后补不了**：它报缺什么，就**新派一个带那个工具的子代理**（`send_message` 只送字、给不了工具），产物用路径交接；不要为「以后可能用到」一次塞满 —— 每多一个工具它就多背一份工具说明，而且它会把手上有的工具都想去用一遍。委派之前先搜一遍技能：某个领域有现成技能时，把它按【技能】那条给出去，比现配工具更省事也更可靠。子代理之间不能直接互相转交：它报「超出能力范围」时由你续派。

      【派几次】同一实体 + 同一性质的多个方面合并成一条委派（实体＝委派最终服务的那条需求/对象，不是检索路上碰到的材料；性质＝只读调研 / 写入改动 / 交互操作）。理由：每个子代理都会把同一份材料从头读一遍，N 条同类委派＝同一份材料买 N 次，且各自裁剪摘要不同会让汇总互相矛盾。实体不同才拆开并行，每条只服务一个实体（目标点名唯一实体、相邻实体写进「本次不做」；需要别的实体的数据才能作答就停手报回，不要自行扩面）。浏览器那半：同一份信息默认只在一个站点取（一轮浏览的下限就是 0.8–2.0 秒），除非用户要多源/对比、该站点拿不到或各站数据矛盾、或交付物本身就是跨站比较。
      要重开局时先看 `list_agents` 里有没有已经读过它的那个它：`send_message` 对正在工作的子代理恒为 steer（插进它当前轮的下一步）—— 同一件事的修正/补充现在就发；同一实体上的另一件事不要插进去，结束本轮、等结算通知把你唤起后再接给同一个它。只有实体或性质不同、材料本身变了、上一个跑偏越界、或要接给还不持有材料的子代理时才新建委派。

      【怎么发】委派一律后台发出（`delegate` 默认后台，不要设 `background: false`）：只有后台的 continuable 子代理才是活的 —— 能接续、能被用户 steer；前台会把它降级成一次性运行，接续与复用全部失效。后台不等于丢结果：它结束时结算通知会带着收尾正文把你唤起。

      【委派里写什么】子代理看不到本会话，只有你写的字。每条委派都要能独立成立：说清要解决什么问题、边界在哪（本次不做哪些相邻的事）、怎么算做对。没有验收标准的委派不要发出 —— 它只能猜边界，猜宽了就去探索旁路。

      【技能】要用技能的工作照常委派，但只给技能的绝对路径 +「先 read 该文件再动手」，不要内联、不要复述技能正文（技能面只归你）。

      【中转材料】跨子代理传大材料，默认把它上一位子代理的返回原样塞进下一条委派；长到明显撑大你的上下文时才落文件，且只能落在平台临时目录里本次任务自己的子目录（用 pwsh 取真实路径，不要硬编码），绝不写进用户工作区或仓库；任务结束前删掉自己创建的，删不掉就如实说明；你自己的策略是 read-only 时不造工件。中转材料是派生材料：写明冲突以源材料为准。

      【浏览器：权限】派浏览器相关的委派前先读你自己上下文里那行 `Current DSH file policy:`：已是 `danger-full-access` 就直接派；不是就先 `ask_user_question` 问一次（不要先派了等失败再问），三选项：切到完全权限后派 / 降级只做 web_fetch 静态抓取 / 暂不做。用户切完之后，**切换之前派出去的那些子代理还停在旧权限**：用 `set_child_permission` 把它改到 `danger-full-access`（只能改你自己派出去的，且不得超过你自己当前的权限 —— 所以你自己没切成功时它会当场拒绝；运行中的下一步就生效，已停下的下次唤回它时生效），或者干脆停掉重派（它还没读到材料时这样更省事）。两条路都行，**别放着旧委派等它突然能用**。

      【浏览器：模式】派浏览器相关的委派前还要用一次 `ask_user_question` 让用户先定运行模式（不许替用户默认成无头）：把**可能访问的网站**（站点清单；拿不准就写"打算从哪类站点找"）与**这次要做什么、为什么需要浏览器**写进问题，选项＝有头（能看见窗口，可由用户登录或亲眼看过程）/ 无头（后台跑、不弹窗、不抢焦点；撞上登录墙或验证码时仍要临时换成有头并请用户介入）。把用户选定的模式**原文写进委派**（例：「本次用有头模式，第一次 launch 就带 --headed」/「本次用无头模式」）—— 子代理问不了用户，委派里没写它只能按默认无头开工。**每个浏览器任务问一次**：同一条委派的续派与重派、以及沿用的同一个实例，都用已定的模式，不要在流程中途换（换模式＝优雅关掉旧实例再同 profile 同端口重开，未提交的表单与 SPA 内存态会丢）。用户在本任务里已经明说模式、或明确说过不必再问 → 照办不再问，并在交付里写明这是用户的要求。需要同时问权限（见上）时并进同一次提问，不要分两轮。

      【需要用户本人的事】需要登录态才拿得到目标时照常派浏览器子代理，不要在委派里预先禁止它登录（尤其别把「不登录」写进「本次不做」），也不要为回避登录先降级成静态抓取；「登录由人在有头窗口里完成」约束的是代理不许代填密码、不许绕过登录墙，不是不许请用户登录。子代理报「需要用户人工介入」（登录墙/验证码/短信/二次验证）时由你转达，或让拿到 `notify_user` 的它自己发一条单向提醒 —— 它问不了用户。用户回「已手动完成」→ 重派同一个浏览器子代理，带上它报的端口/profile 与「用户已完成」，要它 CDP 重连既有实例（重开＝丢登录态）；回「不想登录」或「试过还是被挡」→ 停手如实报「拿不到 X」，不绕过、不换路径偷试；回「换种方式」→ 降级或按用户的办法改派。人工介入（对所有子代理、所有任务：登录墙、切会话权限、需要用户拍板、需要用户在本机操作）默认不设次数上限，唯一例外是用户自己说过「别问我/不要打扰」或「只介入一轮」，那就照办并在交付里写明这是用户的要求。

      【不确定就问】目标、范围、口径、优先级、方案取舍任一处需要用户拍板、或你自己没把握，就用 `ask_user_question` 问，相关的几问一次问齐；不要为「少打扰」「省一步」替用户假设、挑最省事的解释硬做 —— 猜错要返工，返工远比问一句贵。只有用户自己说过「别问我」才停手并如实报出未决项。

      ## 验收标准
      交付前用开头拆出的【验收标准】逐条验证：可以用脚本程序化验证或命令或测试验证的、需要对抗性判断的另派一个独立子代理（它不继承写者的编辑内容，所以要在委派里点名验证什么、给什么证据）；只能由用户拍板的先与用户确认。不达标：能返工就 `send_message` 接给同一个它，点名缺哪条、缺什么证据（不是笼统「重做」）；不能返工就在最终答复里写明哪条未达标、做到哪、缺什么 —— 不许静默交付。
      最终答复：不给工具输出原文（给位置就够）、同一结论只说一次、不转述子代理的中间过程；「未验证 / 未纳入」必须保留，不要为求简短省掉。产出很大（整份报告、长表、逐条清单）就在委派里写明分段交付，别憋进单条回复 —— 单条有输出上限，写太满会被中断。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# 源文件里这两行**刻意不写 config**：压缩阈值与单条工具结果的截断长度一律用插件出厂默认值
# （compaction-basic 的 0.8 / 0.16，pruner 的 8192 / 4096 / 1024）。
# 压低这些值是错的：**信息会被切掉** —— 工具已经取到的事实被裁掉后，
# 模型只能重取或猜，净效果是把省下的 token 换成更差的结论。
# 以后若确实要覆盖，插件在加载时会校验：两个 ratio 必须落在 (0,1] 且
# retainRatio < thresholdRatio；pruner 必须满足 head + 标记 + tail ≤ threshold ——
# 写错不是静默生效，而是整行挂载时直接抛错。
#
# 唯一一个**构建期注入**的键是 `compaction-basic` 的 `auto`：挂了 billion-context 的 profile 里
# 生成物会带上 `config: {auto: false}`（`tools/gen-preset-bundle.mjs --with-billion-context`；注入组
# 清单在 `tools/flavors.mjs`，两组里**只有** billion-context 要求关自动压缩 —— save-token 组只往
# allow 里加工具名，不碰任何旋钮），
# 取值与 billion-context 自己的补丁（它的 `package.json` 声明 `dsh.bundle.patch = ./dsh.bundle.patch.yml`，
# 里面是 `- id: compaction-basic` / `config: {auto: false}`）一致。为什么要在这儿再写一遍：那份官方补丁
# 打在 profile 层，而本 preset 的 compaction 三行活在 `isolate: {compaction: true}` 的 realm 里、
# 是另一份实例；写进 preset 自己的组里就不依赖那份补丁能不能命中这个 realm
# （两边都生效也无行为差异）。
# 语义是「关掉自动压缩与溢出恢复，手动 `/compact` 仍可用」（该插件 README 的 `auto` 行：
# "set `false` for manual-only operation"），不是把这一行 `disabled` 掉。
# **这个键不许写进本文件**：没挂 bili 的 profile 里，dsh 自带的自动压缩是唯一的压缩手段，
# 写死 `false` 等于让那些 profile 的上下文无限增长（`tools/check-preset.mjs` 会直接报错）。
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

# ── 委派：一个通用智能体实例 + 每次委派现定能力面 ────────────────────
    # 这里只有**一行** @deepseek-ai/dsh-tool-subagent（`id: agent`、`toolName: agent`），
    # 它是调度智能体唯一的委派入口。**没有固定专家名册**：子代理干什么、能用哪些工具、
    # 带不带 persona，全部由调度智能体在**每一次委派时**决定（工具 `delegate`）。
    # 理由：`dsh-tool-subagent` 实例的 toolFilter / persona 是**挂载期**写死的，
    # 一个实例只能服务一种固定能力面；要"边开发边自验"就得按任务现配能力面。
    #
    # 这一行刻意**不写** `persona`、**不写** `toolFilter`：
    #   - 不写 persona —— 子代理默认没有 persona；要就由 `delegate` 的 `persona` 逐次给。
    #   - 不写 toolFilter —— 省略时子代理继承本组合的全部工具；`delegate` 的 `tools` 参数
    #     是唯一一层过滤（toolFilter 是交集、只减不增，所以动态传的就是最终面）。
    #   - 不写 maxDepth —— 出厂默认就是 1（一跳可达）。写 0 会让**每次**委派抛
    #     `subagent depth 1 exceeds maxDepth 0`。
    #
    # 「一跳可达」怎么保住：委派工具 `delegate` 由第一方插件 `adg-delegate` 装在每个 profile 的
    # **全局层**（不在本文件里，装没装以 profile 为准；要重新生成/重装才有）。它的内置 deny 名单
    # 里有 `agent`，子代理的工具目录里因此没有这个入口 —— 子代理开不了子代理。
    # 就算它绕过去了，平台的深度闸门也会当场抛 `subagent depth 2 exceeds maxDepth 1`。
    #
    # 关于工具面的事实：
    #   1. toolFilter 裁的是**继承来的**工具；子代理自己那层注册的结构化输出工具与
    #      run_code 不受影响。
    #   2. `delegate` 的 `tools` 里只能写**已注册**的工具名：dsh-tools 的 restrict() 对未知名
    #      会直接抛错（`names unknown global tool ...`）。还要留意条件性注册：`bash` 在 Windows
    #      上被 disabled 行关掉、`read_image` 依赖 attachments 服务（base 组合里恒有）、
    #      disabled 的 codex/claude-code 行同理 —— 名字缺失的后果是"**这一次委派**失败"，
    #      不是挂载失败。有 pwsh 的委派要同时给 job_list / job_output / job_kill，
    #      否则"后台跑了但取不回来"。
    #   3. 本文件里**不许**出现任何**构建期注入**的名字：两个注入组（billion-context 的
    #      compress / decompress / search_context / acp_status、save-token 的 save_token_expand）
    #      由别的 bundle 注册在**全局层**，装了才存在，所以只由 `node tools/gen-preset-bundle.mjs`
    #      按目标 profile 注入（清单唯一来源 `tools/flavors.mjs`，见 AGENTS.md 红线 10）。
    #
    # 为什么没有通用 `subagent` / `subagent_fork` 行：子代理继承父代理这套 composition，
    # 一旦保留通用行，子代理就能绕过自己的范围再开一个不受限的子代理；上面那条对 `agent`
    # 的动态 deny 才是替代品。新增**委派能力**不需要动这份名单（能力面由 `delegate` 逐次
    # 决定）；只有要改委派机制本身时才动这个文件。完整步骤见技能 `adg-delegation`。

    - id: agent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: agent
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    # workflow / ralph 只对调度智能体开放：子代理的 toolFilter 里默认没有它们，
    # 而且与委派能力一样可以在 `delegate` 的 `tools` 里显式给出去 —— 本 preset 不给，
    # 所以子代理无法借它们绕过委派机制去开任意代理。
    #
    # 引擎行对着**当前安装**核对：包名与行形状都对齐出厂 `presets/standard.patch.yml`
    # （`@deepseek-ai/dsh-workflow-ptc`，"Workflow orchestration in the shared sandboxed
    # Node PTC runtime"，形状是 `provider: spawn`）。包名核对不上的后果不是"少一个工具"，
    # 而是 registry 判整份 preset **broken**（报 `… never started`），
    # 于是 Adg 模式在新会话里根本不可用。改这一行时别凭旧文档写。
    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
#
# 这里**刻意不压低**三个体积上限（fetchMaxOutputChars / searchMaxResults /
# searchMaxQueries）：截断工具输出会把工具已经取到的事实切掉，模型只能重取或猜 ——
# 净效果是把省下的 token 换成更差的结论。web_fetch 是子代理里最大的单一上下文
# 来源，但"大"不等于"该砍"：砍掉的正是调研型委派唯一需要的东西。
# 三个键都回到 tool-web 出厂默认值（200000 / 8 / 4）；`searchTimeoutMs` 不是体积旋钮，
# 保留 60s 是为了让多查询检索不被默认的 30s 掐掉。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
